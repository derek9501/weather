name: Taiwan Weather Cron Job

on:
  schedule:
    - cron: '*/15 * * * *' # 每 15 分鐘自動跑一次
  workflow_dispatch: # 支援手動點擊執行

# 賦予 GitHub Actions 自動 Push 修改內容的寫入權限
permissions:
  contents: write

jobs:
  run-weather-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Weather Tracker
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: node index.js

      # 自動 Commit 並 Push 更新後的 weather_data.json
      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update weather & typhoon data [skip ci]"
          file_pattern: 'data/weather_data.json'
